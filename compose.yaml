services:
  rowake:
    image: ghcr.io/doout/rowake:latest
    build:
      context: .
      args:
        VERSION: dev
    ports:
      - "8080:8080"
    environment:
      ROWAKE_ACCESS_TOKEN: ${ROWAKE_ACCESS_TOKEN:-}
    volumes:
      - ./data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

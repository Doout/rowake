name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Static checks and tests
        run: make check

      - name: Race detector
        run: make race

      - name: Vulnerability scan
        run: make vuln

      - name: Startup smoke test
        run: make smoke

      - name: Cross-build release targets
        run: make cross-build

      - name: Validate scripts and Compose
        run: |
          shellcheck scripts/*.sh
          docker compose config --quiet

      - name: Build container
        run: docker build -t rowake:ci .

  external-drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test PostgreSQL and MySQL drivers
        env:
          ROWAKE_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          ROWAKE_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql
        run: make integration

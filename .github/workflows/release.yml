name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version without the v prefix"
        required: true
        default: "0.1.0-dev.1"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          printf '%s\n' "$version" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$' \
            || { echo "invalid release version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = push ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify source and SQLite workflow
        run: |
          make check
          make smoke

      - name: Verify external drivers
        env:
          ROWAKE_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          ROWAKE_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql
        run: make integration

  server:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build server archives
        run: make release VERSION=${{ needs.prepare.outputs.version }}

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error

  desktop:
    needs: [prepare, verify]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: desktop-wails/go.sum

      - name: Build macOS desktop application
        run: make desktop-build VERSION=${{ needs.prepare.outputs.version }}

      - name: Verify embedded version
        run: |
          desktop-wails/build/bin/Rowake.app/Contents/MacOS/Rowake version \
            | grep -Fx "${{ needs.prepare.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            desktop-wails/build/bin/Rowake.app/Contents/Info.plist \
            | grep -Fx "${{ needs.prepare.outputs.version }}"

      - name: Package desktop application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            desktop-wails/build/bin/Rowake.app \
            "Rowake-${{ needs.prepare.outputs.version }}-macOS.zip"
          shasum -a 256 "Rowake-${{ needs.prepare.outputs.version }}-macOS.zip" \
            > "Rowake-${{ needs.prepare.outputs.version }}-macOS.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ needs.prepare.outputs.version }}
          path: |
            Rowake-${{ needs.prepare.outputs.version }}-macOS.zip
            Rowake-${{ needs.prepare.outputs.version }}-macOS.zip.sha256
          if-no-files-found: error

  container:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.publish == 'true' }}

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, server, desktop, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download server artifacts
        uses: actions/download-artifact@v8
        with:
          name: server-${{ needs.prepare.outputs.version }}
          path: release

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-${{ needs.prepare.outputs.version }}
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Rowake $VERSION" --generate-notes
          fi
          find release -type f -print0 \
            | xargs -0 gh release upload "$tag" --clobber

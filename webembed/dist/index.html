<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f12">
  <meta name="csp-nonce" content="{{CSP_NONCE}}">
  <title>Rowake</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="shell"></div>
  <div id="cell-value-preview" class="cell-value-preview" role="tooltip" aria-hidden="true" hidden>
    <header>
      <span class="cell-value-preview-type" data-cell-preview-type>Value</span>
      <span class="cell-value-preview-meta" data-cell-preview-meta></span>
    </header>
    <pre data-cell-preview-content></pre>
  </div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
